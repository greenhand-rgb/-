  /* ===== 波点纹理 ===== */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(240,140,175,.16) 1.2px, transparent 1.3px);
    background-size: 26px 26px;
    opacity: .28;
    z-index: 0;
  }

  .page { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }

  /* ===== 标题区 ===== */
  .headline { text-align: center; margin-bottom: 26px; }
  .headline .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    color: var(--pink-deep);
    background: rgba(242,107,156,.10);
    border: 1px solid rgba(242,107,156,.28);
    padding: 6px 16px; border-radius: 999px;
  }
  .headline .kicker svg { width: 14px; height: 14px; }
  .headline h1 {
    margin-top: 14px;
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--ink);
  }
  .headline h1 .hl { color: var(--pink-deep); }
  .headline p {
    margin-top: 8px;
    font-size: clamp(14px, 2.6vw, 16px);
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* ===== 转盘区 ===== */
  .wheel-wrap { position: relative; width: min(86vw, 400px); margin: 4px 0 26px; }

  .wheel-wrap .wheel {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 18px 30px rgba(224,79,134,.22));
    will-change: transform;
  }
  .wheel-wrap .wheel.spinning { cursor: default; }

  .wheel-wrap .pointer {
    position: absolute;
    top: -12px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    width: 0; height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 34px solid var(--pink-deep);
    filter: drop-shadow(0 4px 6px rgba(224,79,134,.35));
    transition: transform .25s ease;
  }
  .wheel-wrap .pointer::after {
    content: "";
    position: absolute;
    left: -5px; top: -38px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--pink-deep);
  }
  .wheel-wrap.pulse .pointer { transform: translateX(-50%) scale(1.18); }

  .wheel-wrap .hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 84px; height: 84px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: #fff;
    color: var(--pink-deep);
    font-family: inherit;
    font-size: 18px; font-weight: 900; letter-spacing: 1px;
    box-shadow: 0 8px 22px rgba(224,79,134,.30), inset 0 0 0 5px #FFE9F1, inset 0 0 0 7px #fff;
    z-index: 6;
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .wheel-wrap .hub svg { width: 20px; height: 20px; }
  .wheel-wrap .hub:hover { transform: translate(-50%, -50%) scale(1.06); }
  .wheel-wrap .hub:active { transform: translate(-50%, -50%) scale(.95); }
  .wheel-wrap .hub:focus-visible { outline: 3px solid rgba(224,79,134,.5); outline-offset: 3px; }
  .wheel-wrap .hub[disabled] { cursor: default; opacity: .85; }

  /* ===== 底部状态 ===== */
  .status { text-align: center; min-height: 96px; }
  .status .hint { font-size: 14px; color: var(--ink-soft); font-weight: 500; }
  .status .spin-btn {
    margin-top: 14px;
    border: none; cursor: pointer;
    font-family: inherit;
    font-size: 17px; font-weight: 900; letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    padding: 13px 42px;
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(224,79,134,.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .status .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(224,79,134,.42); }
  .status .spin-btn:active { transform: translateY(0) scale(.97); }
  .status .spin-btn:focus-visible { outline: 3px solid rgba(224,79,134,.5); outline-offset: 3px; }
  .status .spin-btn[disabled] { cursor: default; opacity: .6; transform: none; }

  .status .locked {
    display: inline-flex; align-items: center; gap: 12px;
    background: #fff;
    border: 2px solid var(--pink);
    color: var(--pink-deep);
    font-size: 17px; font-weight: 900;
    padding: 14px 26px; border-radius: 24px;
    box-shadow: 0 10px 24px rgba(224,79,134,.22);
    animation: pop-in .45s cubic-bezier(.2,1.6,.4,1);
    max-width: min(92vw, 460px);
  }
  .status .locked svg { width: 22px; height: 22px; flex-shrink: 0; }
  .status .locked .sub { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); letter-spacing: 1px; }
  .status .locked .col { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .status .locked .send-status { font-size: 12px; font-weight: 700; letter-spacing: .5px; }

  /* ===== 轻提示 ===== */
  .toast {
    position: fixed;
    left: 50%; bottom: 40px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(91,58,78,.93);
    color: #fff;
    font-size: 13.5px; font-weight: 600; letter-spacing: .5px;
    padding: 11px 20px;
    border-radius: 999px;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    max-width: 86vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 结果弹层 ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(91,58,78,.42);
    backdrop-filter: blur(4px);
    padding: 20px;
  }
  .overlay.show { display: flex; animation: fade-in .25s ease; }

  .result-card {
    position: relative;
    width: min(92vw, 380px);
    background: #fff;
    border-radius: 26px;
    padding: 30px 26px 26px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(91,58,78,.28);
    animation: pop-in .5s cubic-bezier(.2,1.6,.4,1);
  }
  .result-card .result-icon {
    width: 92px; height: 92px;
    margin: 0 auto 12px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .result-card .result-icon img {
    width: 78px; height: 78px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    box-shadow: 0 4px 12px rgba(91,58,78,.20);
  }
  .result-card h2 { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: var(--ink); }
  .result-card h2 span { color: var(--pink-deep); }
  .result-card .msg { margin-top: 10px; font-size: 14px; line-height: 1.7; color: var(--ink-soft); font-weight: 500; }
  .result-card .actions { margin-top: 22px; display: flex; gap: 12px; justify-content: center; }
  .result-card .actions button {
    border: none; cursor: pointer; font-family: inherit;
    font-size: 15px; font-weight: 800; letter-spacing: 1px;
    padding: 12px 22px; border-radius: 999px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .result-card .actions button:focus-visible { outline: 3px solid rgba(224,79,134,.5); outline-offset: 3px; }
  .result-card .again {
    background: #FFE9F1; color: var(--pink-deep);
  }
  .result-card .lock {
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff;
    box-shadow: 0 8px 18px rgba(224,79,134,.35);
  }
  .result-card .actions button:hover { transform: translateY(-2px); }
  .result-card .actions button:active { transform: scale(.96); }

  /* ===== 管理选项 ===== */
  .manage-wrap { text-align: center; margin: -12px 0 6px; }
  .manage-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1.5px dashed rgba(224,79,134,.5);
    background: rgba(255,255,255,.72);
    color: var(--pink-deep);
    font-size: 12.5px; font-weight: 800; letter-spacing: 1px;
    padding: 8px 16px; border-radius: 999px;
    cursor: pointer; font-family: inherit;
    transition: background .15s ease, transform .15s ease;
  }
  .manage-btn svg { width: 13px; height: 13px; }
  .manage-btn:hover { background: #FFF0F6; transform: translateY(-1px); }
  .manage-btn:focus-visible { outline: 3px solid rgba(224,79,134,.5); outline-offset: 3px; }
  .mgmt-card {
    position: relative;
    width: min(92vw, 400px);
    max-height: 82vh;
    background: #fff;
    border-radius: 24px;
    padding: 24px 22px 22px;
    box-shadow: 0 30px 60px rgba(91,58,78,.28);
    animation: pop-in .35s cubic-bezier(.2,1.6,.4,1);
    display: flex; flex-direction: column;
  }
  .mgmt-card h2 { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: var(--ink); margin-bottom: 14px; text-align: center; }
  .mgmt-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .mgmt-row {
    display: flex; align-items: center; gap: 10px;
    background: #FFF9FB;
    border-radius: 14px;
    padding: 9px 12px;
  }
  .mgmt-row .dot { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(91,58,78,.18); flex-shrink: 0; }
  .mgmt-row .thumb {
    width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid rgba(224,79,134,.28);
  }
  .mgmt-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mgmt-row .thumb svg { width: 20px; height: 20px; }
  .mgmt-row .info { flex: 1; min-width: 0; text-align: left; }
  .mgmt-row .info .nm { font-size: 14px; font-weight: 800; color: var(--ink); }
  .mgmt-row .info .ms { font-size: 11.5px; color: var(--ink-soft); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mgmt-row .op { display: flex; gap: 6px; flex-shrink: 0; }
  .mgmt-row .op button {
    border: none; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 800; letter-spacing: .5px;
    padding: 6px 12px; border-radius: 999px;
    transition: background .15s ease;
  }
  .mgmt-row .op .ed { background: #FFE9F1; color: var(--pink-deep); }
  .mgmt-row .op .ed:hover { background: #FFD9E6; }
  .mgmt-row .op .del { background: #F3E3E9; color: #B05072; }
  .mgmt-row .op .del:hover { background: #EAD2DA; }
  .mgmt-add {
    margin-top: 12px;
    width: 100%;
    border: 2px dashed rgba(224,79,134,.4);
    background: transparent;
    color: var(--pink-deep);
    font-size: 14px; font-weight: 800; letter-spacing: 1px;
    padding: 11px; border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  .mgmt-add:hover { background: #FFF0F6; }
  .mgmt-done {
    margin-top: 10px;
    width: 100%;
    border: none; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #fff;
    font-size: 14px; font-weight: 800; letter-spacing: 2px;
    padding: 11px; border-radius: 999px;
  }
  .mgmt-field { text-align: left; margin-bottom: 12px; }
  .mgmt-field label { display: block; font-size: 12px; font-weight: 800; color: var(--ink-soft); letter-spacing: 1px; margin-bottom: 5px; }
  .mgmt-field input {
    width: 100%; box-sizing: border-box;
    border: 1.5px solid rgba(224,79,134,.25);
    border-radius: 12px;
    padding: 10px 12px;
    font-family: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
    outline: none;
  }
  .mgmt-field input:focus { border-color: var(--pink); }
  .auto-img-hint { font-size: 12px; font-weight: 500; color: var(--ink-soft); line-height: 1.6; margin: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .swatches button {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2.5px solid #fff; cursor: pointer;
    box-shadow: 0 2px 6px rgba(91,58,78,.2);
  }
  .swatches button.on { border-color: var(--ink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
  .edit-actions { display: flex; gap: 10px; margin-top: 4px; }
  .edit-actions button {
    flex: 1; border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 800; letter-spacing: 1px;
    padding: 11px; border-radius: 999px;
  }
  .edit-actions .cancel { background: #F3E3E9; color: #B05072; }
  .edit-actions .save { background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%); color: #fff; }

  /* ===== 飘落爱心 ===== */
  .fall-heart {
    position: fixed;
    top: -30px;
    z-index: 30;
    pointer-events: none;
    animation: fall linear forwards;
  }
  .fall-heart svg { display: block; }

  /* ===== 动画 ===== */
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop-in {
    0% { opacity: 0; transform: scale(.6); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(300deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .wheel-wrap .wheel { transition: transform 1.2s linear !important; }
    .fall-heart { display: none; }
    * { animation-duration: .01s !important; }
  }

  @media (max-width: 640px) {
    .manage-btn { min-height: 44px; padding: 10px 18px; }
  }

  footer.page-note { margin-top: 26px; font-size: 12px; color: rgba(138,106,124,.75); font-weight: 500; }

  .pic { display: none; }
</style>
</head>

  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  /* EmailJS 动态加载：不阻塞页面渲染，只在发送邮件时才拉取 */
  function loadEmailJS(cb) {
    if (typeof emailjs !== "undefined") { cb && cb(); return; }
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
    s.onload = function () { emailjs.init(EMAILJS_PUBLIC_KEY); cb && cb(); };
    s.onerror = function () { cb && cb(); };
    document.head.appendChild(s);
  }

  function sendAuto(okCb, failCb) {
    if (lastIdx < 0) return;
    var item = ITEMS[lastIdx];
    loadEmailJS(function () {
      if (typeof emailjs === "undefined") { failCb && failCb(); return; }
      emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
        name: item.name,
        msg: item.msg,
        to_email: MAIL_TO
      }).then(function () { okCb && okCb(); }, function () { failCb && failCb(); });
    });
  }

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function pt(deg, r) {
    var rad = deg * Math.PI / 180;
    return { x: 220 + r * Math.cos(rad), y: 220 - r * Math.sin(rad) };
  }

  var FOOD_MAP = [
    { keys: ["杨枝甘露", "芒果", "西柚"], id: "mango" },
    { keys: ["柠檬", "柠茶", "冰柠"], id: "lemon" },
    { keys: ["咖啡", "拿铁", "卡布", "美式", "摩卡", "澳白"], id: "coffee" },
    { keys: ["布丁", "焦糖"], id: "budding" },
    { keys: ["果汁", "鲜榨", "橙汁", "芒果汁"], id: "juice" },
    { keys: ["曲奇", "饼干", "奥利奥", "可可"], id: "cookie" },
    { keys: ["双皮奶", "双皮"], id: "pudding" },
    { keys: ["水果", "捞"], id: "fruit" },
    { keys: ["蛋糕", "慕斯", "芝士", "提拉米苏", "千层"], id: "cake" },
    { keys: ["冰", "雪糕", "甜筒", "圣代"], id: "ice" },
    { keys: ["奶", "茶"], id: "tea" }
  ];

  function foodFor(name) {
    for (var i = 0; i < FOOD_MAP.length; i++) {
      var g = FOOD_MAP[i];
      for (var k = 0; k < g.keys.length; k++) {
        if (name.indexOf(g.keys[k]) >= 0) return g.id;
      }
    }
    return "";
  }

  function itemImg(item) {
    var fid = foodFor(item.name) || item.id;
    var el = document.getElementById("pic-" + fid) || document.getElementById("food-" + fid);
    return (el && el.src) ? el.src : "";
  }

  /* 首字徽章：无匹配图时自动生成 */
  function badgeSVG(deep, size, first) {
    var s = size || 78, r = s / 2;
    return '<svg viewBox="0 0 ' + s + ' ' + s + '" width="' + s + '" height="' + s + '">' +
      '<circle cx="' + r + '" cy="' + r + '" r="' + (r - 2) + '" fill="' + deep + '"/>' +
      '<circle cx="' + r + '" cy="' + r + '" r="' + (r - 2) + '" fill="none" stroke="#fff" stroke-width="' + Math.max(2, r / 16) + '"/>' +
      '<text x="' + r + '" y="' + r + '" text-anchor="middle" dominant-baseline="central" font-size="' + (r * 1.05) + '" font-weight="700" fill="#fff" font-family="Noto Sans SC, sans-serif">' + esc(first) + '</text></svg>';
  }

  /* ---------- 转盘生成 ---------- */
  function buildWheel() {
    N = ITEMS.length; SEG = 360 / N;
    var R = 200;
    var rImg = (N <= 5 ? 78 : (N <= 7 ? 66 : 54));
    var half = rImg / 2;
    var fs = (N <= 5 ? 15 : (N <= 7 ? 13 : 11));
    var start0 = 90 + 180 / N;
    var parts = [];
    for (var i = 0; i < N; i++) {
      var it = ITEMS[i];
      var a1 = start0 - i * SEG, a2 = a1 - SEG, mid = a1 - SEG / 2;
      var p1 = pt(a1, R), p2 = pt(a2, R);
      var large = SEG > 180 ? 1 : 0;
      parts.push('<path d="M220,220 L' + p1.x.toFixed(2) + ',' + p1.y.toFixed(2) +
        ' A' + R + ',' + R + ' 0 ' + large + ' 1 ' + p2.x.toFixed(2) + ',' + p2.y.toFixed(2) +
        ' Z" fill="' + it.seg + '" stroke="#fff" stroke-width="4"/>');
      var im = pt(mid, 100);
      var src = itemImg(it);
      if (src) {
        var clipId = "clip" + i;
        parts.push('<defs><clipPath id="' + clipId + '"><circle cx="0" cy="0" r="' + half + '"/></clipPath></defs>');
        parts.push('<g transform="translate(' + im.x.toFixed(2) + ',' + im.y.toFixed(2) + ')">' +
          '<image href="' + src + '" width="' + rImg + '" height="' + rImg + '" x="' + (-half) + '" y="' + (-half) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#' + clipId + ')"/>' +
          '<circle r="' + half + '" fill="none" stroke="#fff" stroke-width="3"/></g>');
      } else {
        parts.push('<g transform="translate(' + im.x.toFixed(2) + ',' + im.y.toFixed(2) + ') scale(' + (rImg / 78).toFixed(3) + ')">' +
          '<circle cx="0" cy="0" r="39" fill="' + it.deep + '"/>' +
          '<circle cx="0" cy="0" r="39" fill="none" stroke="#fff" stroke-width="3"/>' +
          '<text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="41" font-weight="700" fill="#fff" font-family="Noto Sans SC, sans-serif">' + esc(it.name.charAt(0)) + '</text></g>');
      }
      var tl = pt(mid, 163);
      parts.push('<text x="' + tl.x.toFixed(2) + '" y="' + tl.y.toFixed(2) + '" text-anchor="middle" font-size="' + fs + '" font-weight="700" fill="#5B3A4E" font-family="Noto Sans SC, sans-serif">' + esc(it.name) + '</text>');
    }
    parts.push('<circle cx="220" cy="220" r="208" fill="none" stroke="#fff" stroke-width="10"/>');
    parts.push('<circle cx="220" cy="220" r="218" fill="none" stroke="#F7BFD3" stroke-width="2"/>');
    for (var k = 0; k < 16; k++) {
      var dp = pt(90 - k * 22.5, 213);
      parts.push('<circle cx="' + dp.x.toFixed(2) + '" cy="' + dp.y.toFixed(2) + '" r="2.6" fill="#E8A9C2"/>');
    }
    wheel.innerHTML = parts.join("");
    total = 0; spinning = false;
    wheel.style.transition = "none";
    wheel.style.transform = "rotate(0deg)";
    hub.disabled = false;
    if (footerNote) { footerNote.textContent = ITEMS.map(function (x) { return x.name; }).join(" · "); }
  }

  /* ---------- 管理面板 ---------- */
  var mgmtOverlay = document.getElementById("mgmtOverlay");
  var editOverlay = document.getElementById("editOverlay");
  var mgmtList = document.getElementById("mgmtList");
  var editTitle = document.getElementById("editTitle");
  var fName = document.getElementById("fName");
  var fMsg = document.getElementById("fMsg");
  var swatches = document.getElementById("swatches");
  var editingId = -1;

  function renderMgmtList() {
    mgmtList.innerHTML = ITEMS.map(function (it, i) {
      var src = itemImg(it);
      return '<div class="mgmt-row">' +
        '<span class="thumb">' + (src
          ? '<img src="' + src + '" alt="">'
          : badgeSVG(it.deep, 36, it.name.charAt(0))) + '</span>' +
        '<div class="info"><div class="nm">' + esc(it.name) + '</div><div class="ms">' + esc(it.msg) + '</div></div>' +
        '<div class="op">' +
        '<button type="button" class="ed" data-i="' + i + '">修改</button>' +
        '<button type="button" class="del" data-i="' + i + '">删除</button>' +
        '</div></div>';
    }).join("");
  }

  function openEdit(idx) {
    editingId = idx;
    var it = idx >= 0 ? ITEMS[idx] : null;
    editTitle.textContent = it ? "修改选项" : "新增选项";
    fName.value = it ? it.name : "";
    fMsg.value = it ? it.msg : "";
    swatches.innerHTML = "";
    PALETTE.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.style.background = c.seg;
      b.style.borderColor = c.deep;
      b.dataset.seg = c.seg;
      b.dataset.deep = c.deep;
      if (it && it.seg === c.seg && it.deep === c.deep) { b.className = "on"; }
      b.addEventListener("click", function () {
        swatches.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
      });
      swatches.appendChild(b);
    });
    editOverlay.classList.add("show");
    fName.focus();
  }

  function saveEdit() {
    var name = fName.value.trim();
    if (!name) { showToast("名称不能为空"); return; }
    var on = swatches.querySelector("button.on");
    var seg = on ? on.dataset.seg : PALETTE[0].seg;
    var deep = on ? on.dataset.deep : PALETTE[0].deep;
    var msg = fMsg.value.trim();
    if (editingId >= 0) {
      ITEMS[editingId].name = name;
      ITEMS[editingId].msg = msg;
      ITEMS[editingId].seg = seg;
      ITEMS[editingId].deep = deep;
    } else {
      ITEMS.push({ id: "c" + Date.now().toString(36), name: name, seg: seg, deep: deep, msg: msg || "好吃又好看，快乐加倍" });
    }
    saveItems();
    editOverlay.classList.remove("show");
    buildWheel();
    renderMgmtList();
    showToast("已保存");
  }

  /* ---------- 转动 ---------- */
  function pickIndex() {
    var a = ((-total) % 360 + 360) % 360;
    return Math.floor((a + SEG / 2) / SEG) % N;
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    hub.disabled = true;
    var add = 360 * (5 + Math.floor(Math.random() * 3)) + Math.floor(Math.random() * 360);
    total += add;
    wheel.style.transition = "transform " + (SPIN_MS / 1000) + "s cubic-bezier(0.12,0.8,0.25,1)";
    wheel.style.transform = "rotate(" + total + "deg)";
    wheelWrap.classList.add("pulse");
    setTimeout(function () {
      wheelWrap.classList.remove("pulse");
      hub.disabled = false;
      spinning = false;
      showResult(pickIndex());
    }, SPIN_MS + 60);
  }

  /* ---------- 结果 ---------- */
  function showResult(idx) {
    lastIdx = idx;
    var item = ITEMS[idx];
    document.getElementById("resultName").textContent = item.name;
    document.getElementById("resultMsg").textContent = item.msg;
    var iconBox = document.getElementById("resultIcon");
    var src = itemImg(item);
    iconBox.innerHTML = src
      ? '<img src="' + src + '" alt="' + esc(item.name) + '">'
      : badgeSVG(item.deep, 78, item.name.charAt(0));
    iconBox.style.background = item.seg;
    overlay.classList.add("show");
    burstHearts(item.deep);
    document.getElementById("lockBtn").focus();
  }

  function hideOverlay() {
    overlay.classList.remove("show");
    document.querySelectorAll(".fall-heart").forEach(function (el) { el.remove(); });
  }

  function lockIn(idx) {
    var item = ITEMS[idx];
    hideOverlay();
    statusBox.innerHTML =
      '<div class="locked"><svg viewBox="0 0 24 24" fill="' + item.deep + '"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' +
      '<div class="col"><span>今日下午茶已锁定</span>' +
      '<span class="sub" style="color:' + item.deep + '">' + item.name + ' · ' + item.msg.split("，")[0] + '</span>' +
      '<span class="send-status" id="sendStatus">自动发送中…</span></div></div>';
    sendAuto(
      function () {
        var el = document.getElementById("sendStatus");
        if (el) { el.textContent = "已自动发送到待投喂清单"; el.style.color = "#3E9C8A"; }
      },
      function () {
        var el = document.getElementById("sendStatus");
        if (el) { el.textContent = "自动发送失败：请检查网络后重试"; el.style.color = "#E0658F"; }
      }
    );
  }

  function burstHearts(color) {
    if (reduced) return;
    for (var i = 0; i < 16; i++) {
      var el = document.createElement("span");
      el.className = "fall-heart";
      el.style.left = (Math.random() * 100) + "vw";
      el.style.animationDuration = (2.2 + Math.random() * 1.6) + "s";
      el.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
      var size = 12 + Math.random() * 14;
      el.style.width = size + "px";
      el.style.height = size + "px";
      el.innerHTML = '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="' + color + '"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
      document.body.appendChild(el);
    }
  }

  /* ---------- 事件 ---------- */
  hub.addEventListener("click", spin);
  document.getElementById("againBtn").addEventListener("click", function () { hideOverlay(); spin(); });
  document.getElementById("lockBtn").addEventListener("click", function () { lockIn(pickIndex()); });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) hideOverlay(); });

  document.getElementById("manageBtn").addEventListener("click", function () {
    renderMgmtList();
    mgmtOverlay.classList.add("show");
  });
  document.getElementById("mgmtClose").addEventListener("click", function () { mgmtOverlay.classList.remove("show"); });
  document.getElementById("addBtn").addEventListener("click", function () { openEdit(-1); });
  mgmtList.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    var i = parseInt(b.dataset.i, 10);
    if (isNaN(i)) return;
    if (b.classList.contains("ed")) {
      openEdit(i);
    } else if (b.classList.contains("del")) {
      if (ITEMS.length <= 2) { showToast("至少保留 2 个选项"); return; }
      ITEMS.splice(i, 1);
      saveItems();
      buildWheel();
      renderMgmtList();
      showToast("已删除");
    }
  });
  document.getElementById("editCancel").addEventListener("click", function () { editOverlay.classList.remove("show"); });
  document.getElementById("editSave").addEventListener("click", saveEdit);
  mgmtOverlay.addEventListener("click", function (e) { if (e.target === mgmtOverlay) mgmtOverlay.classList.remove("show"); });
  editOverlay.addEventListener("click", function (e) { if (e.target === editOverlay) editOverlay.classList.remove("show"); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (editOverlay.classList.contains("show")) { editOverlay.classList.remove("show"); return; }
      if (mgmtOverlay.classList.contains("show")) { mgmtOverlay.classList.remove("show"); return; }
      if (overlay.classList.contains("show")) hideOverlay();
    }
    if (e.key === "Enter" && overlay.classList.contains("show") && e.target === overlay) lockIn(pickIndex());
  });

  /* ---------- 初始化 ---------- */
  buildWheel();
})();
</script>
</body>
</html>
